[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doFolder"
description = "Manage files more easily"
authors = [{ name = "kuankuan", email = "2163826131@qq.com" }]
readme = "README.md"
license = "MulanPSL-2.0"
requires-python = ">=3.9"
dynamic = ["version"]

classifiers = [
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
]
keywords = ["folder", "file", "manage", "filesystem", 'directory']
dependencies = [
    "exceptiongroup",
    "typing_extensions>=4.10.0",
    "deprecated",
    "rich",
    "types-Deprecated",
]
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/kuankuan2007/do-folder"
Issues = "https://github.com/kuankuan2007/do-folder/issues"
Documentation = "https://do-folder.doc.kuankuan.site"

[project.scripts]
do-hash = "doFolder.scripts:doHash"
do-compare = "doFolder.scripts:doCompare"
do-folder = "doFolder.scripts:doFolder"

[tool.setuptools.dynamic]
version = { attr = "doFolder.__pkginfo__.__version__" }
